<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'" />
  <title>MacroPad Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #12121f;
      color: #d0d0e0;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #e53935;
      box-shadow: 0 0 6px #e5393580;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .dot.running {
      background: #43a047;
      box-shadow: 0 0 8px #43a04780;
    }

    .status-label {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: #aaa;
    }

    .status-label span {
      color: #d0d0e0;
    }

    /* ── Buttons ── */
    .controls {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 7px 22px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #btn-start { background: #2e7d32; color: #fff; }
    #btn-start:hover:not(:disabled) { background: #388e3c; }

    #btn-stop  { background: #c62828; color: #fff; }
    #btn-stop:hover:not(:disabled)  { background: #e53935; }

    #btn-update { background: #1565c0; color: #fff; }
    #btn-update:hover:not(:disabled) { background: #1976d2; }

    /* ── Log pane ── */
    #log-wrap {
      flex: 1;
      background: #0a0a16;
      border: 1px solid #1e1e35;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #log-title {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #555;
      border-bottom: 1px solid #1e1e35;
      text-transform: uppercase;
    }

    #logs {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.6;
      color: #b0b8cc;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #logs::-webkit-scrollbar { width: 6px; }
    #logs::-webkit-scrollbar-track { background: transparent; }
    #logs::-webkit-scrollbar-thumb { background: #2a2a45; border-radius: 3px; }

    .log-error { color: #ef9a9a; }
    .log-info  { color: #80cbc4; }
  </style>
</head>
<body>

  <div class="header">
    <div class="status-group">
      <div class="dot" id="dot"></div>
      <div class="status-label">Service: <span id="status-text">STOPPED</span></div>
    </div>
    <div class="controls">
      <button id="btn-start">START</button>
      <button id="btn-stop">STOP</button>
      <button id="btn-update">UPDATE</button>
    </div>
  </div>

  <div id="log-wrap">
    <div id="log-title">Live Logs</div>
    <div id="logs"></div>
  </div>

  <script>
    const dot        = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const btnStart   = document.getElementById('btn-start');
    const btnStop    = document.getElementById('btn-stop');
    const btnUpdate  = document.getElementById('btn-update');
    const logs       = document.getElementById('logs');

    function setStatus(status) {
      const running = status === 'running';
      dot.classList.toggle('running', running);
      statusText.textContent = running ? 'RUNNING' : 'STOPPED';
      btnStart.disabled = running;
      btnStop.disabled  = !running;
    }

    function appendLog(text) {
      const span = document.createElement('span');
      if (/error|fail|FAIL/i.test(text)) span.className = 'log-error';
      else if (/connected|started|refreshed|toggled|scene/i.test(text)) span.className = 'log-info';
      span.textContent = text;
      logs.appendChild(span);
      logs.scrollTop = logs.scrollHeight;
    }

    window.api.onStatus(setStatus);
    window.api.onLog(appendLog);

    btnStart.addEventListener('click',  () => window.api.start());
    btnStop.addEventListener('click',   () => window.api.stop());
    btnUpdate.addEventListener('click', () => window.api.update());

    window.api.getStatus().then(setStatus);
  </script>
</body>
</html>
